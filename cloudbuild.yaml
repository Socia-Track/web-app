steps:
  # Build and push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sociatrack-frontend:latest'
      - '--build-arg'
      - 'VITE_API_URL=https://sociatrack-backend-802172403809.us-central1.run.app'
      - '--build-arg'
      - 'VITE_LANDING_URL=https://sociatrack.com'
      - '--build-arg'
      - 'VITE_APP_URL=https://app.sociatrack.com'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sociatrack-frontend:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sociatrack-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sociatrack-frontend:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/sociatrack-frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
