name: Deploy Frontend to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build application
        env:
          VITE_API_URL: https://api.sociatrack.com
          VITE_API_BASE_URL: https://api.sociatrack.com/api
          VITE_BACKEND_URL: https://api.sociatrack.com
          VITE_LANDING_URL: https://sociatrack.com
          VITE_APP_URL: https://app.sociatrack.com
          VITE_WALLETCONNECT_PROJECT_ID: 2f05a7ca2bb7abb24e2d7b700e80f90e
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          skip_app_build: true
          app_location: "dist"

      - name: Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Frontend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **App**: sociatrack-webapp" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://app.sociatrack.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Deployed ✅" >> $GITHUB_STEP_SUMMARY